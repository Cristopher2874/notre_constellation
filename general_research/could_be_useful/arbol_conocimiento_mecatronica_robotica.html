
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{display:flex;gap:0;min-height:600px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}

.chevron.leaf{visibility:hidden}
.node-label{display:flex;align-items:center;gap:6px;flex:1;min-width:0;padding:1px 8px 1px 0}
.node-name{font-size:13px;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:1px 6px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.d0{background:var(--color-background-success);color:var(--color-text-success)}
.d1{background:var(--color-background-info);color:var(--color-text-info)}
.d2{background:#EDE9FE;color:#4C1D95}
.d2-dark{background:#2e1065;color:#ddd6fe}
.d3{background:#FEF3C7;color:#92400E}
.d4{background:#FFE4E6;color:#9F1239}
.d5{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.start-badge{font-size:10px;padding:1px 7px;border-radius:999px;background:#0F6E56;color:#E1F5EE;font-weight:500}
.children-wrap{overflow:hidden;transition:max-height 0.25s ease}
.detail-empty{color:var(--color-text-secondary);font-size:14px;padding-top:40px;text-align:center}
.detail-title{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.detail-sub{font-size:12px;color:var(--color-text-secondary);margin-bottom:16px}
.dist-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:16px;font-weight:500}
.dist-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.dist-bar{height:6px;border-radius:3px;background:var(--color-border-tertiary);flex:1;overflow:hidden}
.dist-fill{height:100%;border-radius:3px}
.section-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;margin-top:20px}
.detail-desc{font-size:14px;color:var(--color-text-primary);line-height:1.6;margin-bottom:4px}
.uni-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:8px}
.uni-name{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.uni-lab{font-size:12px;color:var(--color-text-secondary);margin-bottom:2px}
.uni-resource{font-size:12px;color:var(--color-text-secondary)}
.resource-chip{display:inline-block;font-size:11px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:4px;padding:1px 6px;margin:2px 2px 0 0;color:var(--color-text-secondary)}
.tip-box{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 14px;background:var(--color-background-secondary);font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin-top:12px}

</style>

const distInfo = {

  1:{label:'muy cercano',cls:'d1',fill:'#185FA5',bar:75},
  2:{label:'cercano',cls:'d2',fill:'#534AB7',bar:55},
  3:{label:'relacionado',cls:'d3',fill:'#BA7517',bar:35},
  4:{label:'lejano',cls:'d4',fill:'#993556',bar:20},
  5:{label:'referencia',cls:'d5',fill:'#5F5E5A',bar:10}
};

let selected = null;

function renderTree(nodes, depth){
  return nodes.map(n=>{
    const hasKids = n.children && n.children.length;
    const id = 'tw_'+n.id;
    const isOpen = n.open !== false;
    const di = distInfo[n.d]||distInfo[5];
    return `
    <div>
      <div class="node-row${selected===n.id?' selected':''}" onclick="select('${n.id}');${hasKids?`toggle('${n.id}');`:''}">
        ${'<span class="indent"></span>'.repeat(depth)}
        <span class="chevron${hasKids?isOpen?' open':''.' leaf'}" id="ch_${n.id}">${hasKids?'▶':''}</span>
        <span class="node-label">
          <span class="node-name" title="${n.name}">${n.name}</span>
          ${n.isStart?'<span class="start-badge">tu proyecto</span>':''}
          ${!n.isRoot?`<span class="badge ${di.cls}">${di.label}</span>`:''}
        </span>
      </div>
      ${hasKids?`<div id="${id}" style="max-height:${isOpen?'9999px':'0px'};overflow:hidden;transition:max-height 0.25s ease">${renderTree(n.children,depth+1)}</div>`:''}
    </div>`;
  }).join('');
}

function toggle(id){
  const el = document.getElementById('tw_'+id);
  const ch = document.getElementById('ch_'+id);
  if(!el)return;
  const open = el.style.maxHeight!=='0px';
  el.style.maxHeight = open?'0px':'9999px';
  if(ch) ch.className = 'chevron'+(open?'':' open');
  // update node.open
  function mark(ns){ns.forEach(n=>{if(n.id===id)n.open=!open;if(n.children)mark(n.children);})}
  mark(TREE);
}

function findNode(id, nodes){
  for(const n of nodes){
    if(n.id===id)return n;
    if(n.children){const f=findNode(id,n.children);if(f)return f;}
  }
}

function select(id){
  selected=id;
  document.querySelectorAll('.node-row').forEach(r=>r.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  const n = findNode(id, TREE);
  if(!n)return;
  const di = distInfo[n.d]||distInfo[5];
  const barW = di.bar;
  let uniHTML = '';
  if(n.unis && n.unis.length){
    uniHTML = `<div class="section-label">Universidades & recursos</div>`+
    n.unis.map(u=>`<div class="uni-card">
      <div class="uni-name">${u.name}</div>
      <div class="uni-lab">${u.lab}</div>
      <div style="margin-top:4px">${u.res.map(r=>`<span class="resource-chip">${r}</span>`).join('')}</div>
    </div>`).join('');
  } else if(!n.isRoot){
    uniHTML = `<div class="section-label">Universidades & recursos</div><div style="font-size:13px;color:var(--color-text-secondary)">Consulta el nodo padre para ver los recursos disponibles.</div>`;
  }
  const tipHTML = n.tip ? `<div class="tip-box"><strong style="font-size:12px;font-weight:500">💡 Nota estratégica</strong><br>${n.tip}</div>` : '';
  document.getElementById('detail').innerHTML = `
    <div>
      <div class="detail-title">${n.name.replace('★ ','')}</div>
      <div class="detail-sub">${n.isRoot?'Raíz del árbol':n.isStart?'Tu punto de partida':'Subcampo'}</div>
      ${!n.isRoot?`<span class="badge ${di.cls} dist-pill">${di.label} al brazo robótico</span>
      <div class="dist-bar-wrap">
        <span style="font-size:11px;color:var(--color-text-secondary);white-space:nowrap">lejanía</span>
        <div class="dist-bar"><div class="dist-fill" style="width:${100-barW}%;background:${di.fill};opacity:0.7"></div></div>
        <span style="font-size:11px;color:var(--color-text-secondary);white-space:nowrap">cercanía</span>
        <div class="dist-bar"><div class="dist-fill" style="width:${barW}%;background:${di.fill}"></div></div>
      </div>`:''}
      <div class="section-label">Descripción</div>
      <div class="detail-desc">${n.desc}</div>
      ${uniHTML}
      ${tipHTML}
    </div>`;
}

document.getElementById('tree').innerHTML = renderTree(TREE, 0);
// auto-select brazo
setTimeout(()=>{
  const el = document.querySelector('[onclick*="brazo"]');
  if(el){el.click();}
},80);
</script>

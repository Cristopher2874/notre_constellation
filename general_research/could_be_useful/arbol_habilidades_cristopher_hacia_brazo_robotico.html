const lvInfo = {
  0:{label:'ya lo dominas',fill:'#0F6E56',bg:'#E1F5EE',text:'#0F6E56',bar:100},
  1:{label:'fácil extensión',fill:'#185FA5',bg:'#E6F1FB',text:'#185FA5',bar:78},
  2:{label:'aprendizaje moderado',fill:'#534AB7',bg:'#EDE9FE',text:'#534AB7',bar:55},
  3:{label:'esfuerzo considerable',fill:'#BA7517',bg:'#FEF3C7',text:'#92400E',bar:35},
  4:{label:'gap importante',fill:'#993556',bg:'#FFE4E6',text:'#9F1239',bar:15},
  gap:{label:'gap — necesario',fill:'#991B1B',bg:'#FEF2F2',text:'#991B1B',bar:5}
};

let selected = null;

function getBadgeCls(lv){
  if(lv===0)return 'lv0';
  if(lv===1)return 'lv1';
  if(lv===2)return 'lv2';
  if(lv===3)return 'lv3';
  if(lv===4)return 'lv4';
  return 'lgap';
}

function renderTree(nodes, depth){
  return nodes.map(n=>{
    const hasKids = n.children && n.children.length;
    const id = 'tw_'+n.id;
    const isOpen = n.open !== false;
    const li = lvInfo[n.lv]||lvInfo[0];
    return `<div>
      <div class="node-row${selected===n.id?' selected':''}" onclick="sel('${n.id}');${hasKids?`tog('${n.id}');`:''}">
        ${'<span class="indent"></span>'.repeat(depth)}
        <span class="chevron${hasKids?(isOpen?' open':''):' leaf'}" id="ch_${n.id}">${hasKids?'▶':''}</span>
        <span class="node-label">
          <span class="node-name" title="${n.name}">${n.name}</span>
          ${!n.isRoot?`<span class="badge ${getBadgeCls(n.lv)}">${li.label}</span>`:''}
        </span>
      </div>
      ${hasKids?`<div id="${id}" style="max-height:${isOpen?'9999px':'0px'};overflow:hidden;transition:max-height 0.25s ease">${renderTree(n.children,depth+1)}</div>`:''}
    </div>`;
  }).join('');
}

function tog(id){
  const el=document.getElementById('tw_'+id);
  const ch=document.getElementById('ch_'+id);
  if(!el)return;
  const open=el.style.maxHeight!=='0px';
  el.style.maxHeight=open?'0px':'9999px';
  if(ch)ch.className='chevron'+(open?'':' open');
  function mark(ns){ns.forEach(n=>{if(n.id===id)n.open=!open;if(n.children)mark(n.children);})}
  mark(TREE);
}
function findNode(id,nodes){
  for(const n of nodes){if(n.id===id)return n;if(n.children){const f=findNode(id,n.children);if(f)return f;}}
}
function sel(id){
  selected=id;
  document.querySelectorAll('.node-row').forEach(r=>r.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  const n=findNode(id,TREE);
  if(!n)return;
  const li=lvInfo[n.lv]||lvInfo[0];
  const skillsHtml = n.skills&&n.skills.length?`<div class="sec-label">Habilidades que ya tienes aquí</div>
    <div class="chip-wrap">${n.skills.map(s=>`<span class="chip${s.includes('✓')?' has':''}">${s.replace(' ✓','')}</span>`).join('')}</div>`:'';
  const enablesHtml = n.enables&&n.enables.length?`<div class="sec-label">Qué habilita para tu proyecto</div>
    <ul style="padding-left:0;margin:0">${n.enables.map(e=>`<div class="route-step" style="font-size:13px;margin-bottom:4px;padding-left:14px">${e}</div>`).join('')}</ul>`:'';
  const nextHtml = n.next&&n.next.length?`<div class="sec-label">Siguientes pasos concretos</div>
    <div class="route-box">${n.next.map(s=>`<div class="route-step">${s}</div>`).join('')}</div>`:'';
  const gapHtml = n.gap?`<div class="sec-label">Gap a cubrir</div>
    <div style="font-size:13px;color:var(--color-text-secondary);background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:9px 12px;border:0.5px solid var(--color-border-tertiary)">${n.gap}</div>`:'';
  const uniHtml = n.unis&&n.unis.length?`<div class="sec-label">Recursos en las universidades</div>${n.unis.map(u=>`<div class="uni-card">
    <div class="uni-name">${u.name}</div>
    <div class="uni-lab">${u.lab}</div>
    <div style="margin-top:4px">${u.res.map(r=>`<span class="resource-chip">${r}</span>`).join('')}</div>
  </div>`).join('')}`:'';
  document.getElementById('detail').innerHTML=`<div>
    <div class="det-title">${n.name.replace('⚠ ','')}</div>
    <div class="det-sub">${n.source||''}</div>
    ${!n.isRoot?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span class="badge ${getBadgeCls(n.lv)}" style="font-size:11px;padding:2px 8px">${li.label}</span>
      <div class="skill-bar-bg" style="flex:1"><div class="skill-bar-fill" style="width:${li.bar}%;background:${li.fill}"></div></div>
      <span style="font-size:11px;color:var(--color-text-secondary);min-width:60px">dominio actual</span>
    </div>`:''}
    <div class="sec-label">Descripción</div>
    <div class="det-desc">${n.desc}</div>
    ${skillsHtml}${enablesHtml}${nextHtml}${gapHtml}${uniHtml}
  </div>`;
}

document.getElementById('tree').innerHTML=renderTree(TREE,0);
setTimeout(()=>{const el=document.querySelector('[onclick*="ia"]');if(el)el.click();},80);
</script>
